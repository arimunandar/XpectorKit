name: XpectorDemo
options:
  bundleIdPrefix: com.xpector
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

# Staging is release-class (optimized, no DEBUG) but still runs the inspector,
# proving Xpector works in a non-DEBUG configuration.
configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  XpectorKit:
    path: ..

targets:
  XpectorDemo:
    type: application
    platform: iOS
    sources:
      - XpectorDemo
    dependencies:
      # XpectorServer only. Both products are dynamic (see Package.swift), and
      # listing XpectorKit here as well makes Xcode try to link the XpectorKit
      # *target* statically into two places at once — which it refuses to do
      # while a dynamic product of the same name exists ("linked as a static
      # library by 'XpectorDemo' and 'XpectorKit'"). XpectorServer already
      # depends on XpectorKit, so `import XpectorKit` still resolves.
      - package: XpectorKit
        product: XpectorServer
    info:
      path: XpectorDemo/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "Xpector uses the local network to connect to the Mac debugging tool."
        NSBonjourServices:
          - "_xpector._tcp"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG XPECTOR_ENABLED
        Staging:
          # Compiles as Release (no DEBUG) but still runs Xpector — mirrors a
          # consumer's Staging/Canary config. XPECTOR_ENABLED is the single
          # source of truth for whether the inspector is active.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: XPECTOR_ENABLED
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

# The generated .xcodeproj is gitignored, so without a scheme declared here a
# fresh `xcodegen generate` leaves nothing for `xcodebuild -scheme` to build
# (it previously relied on Xcode auto-creating a user scheme on first open).
schemes:
  XpectorDemo:
    build:
      targets:
        XpectorDemo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Staging
    analyze:
      config: Debug
    archive:
      config: Release
